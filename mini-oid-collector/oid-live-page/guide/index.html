<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#ffffff"><meta name="color-scheme" content="light">
<title>OID live page — Field Guide (private)</title>
<style>
:root{color-scheme:light;--bg:#fff;--panel:#f6f8fa;--line:#d0d7de;--fg:#1f2328;--mut:#59636e;--blue:#0969da}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 10px 40px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 6px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
h1.t{font-size:15px;margin:0}
.tabs{margin-left:auto}.tabs a{display:inline-block;background:var(--panel);color:var(--fg);border:1px solid var(--line);padding:5px 12px;border-radius:6px;font-size:13px;text-decoration:none}
.tabs a.on{background:var(--blue);border-color:var(--blue);color:#fff}
.wrap{display:flex;gap:18px;max-width:1200px;margin:0 auto}
nav{flex:0 0 230px;position:sticky;top:52px;align-self:flex-start;max-height:calc(100vh - 60px);overflow:auto;font-size:13px;padding-top:12px}
nav a{display:block;padding:3px 8px;border-radius:5px;color:var(--fg);text-decoration:none}nav a:hover{background:var(--panel)}nav a.on{background:#ddf4ff;color:var(--blue);font-weight:600}
main{flex:1;min-width:0;padding-top:4px}
@media (max-width:800px){.wrap{display:block}nav{position:static;max-height:none;display:flex;flex-wrap:wrap;gap:2px;padding-top:8px}nav a{border:1px solid var(--line);font-size:12px}}
main img{max-width:100%;border:1px solid var(--line);border-radius:6px}
main table{border-collapse:collapse;display:block;overflow-x:auto;margin:10px 0}main th,main td{border:1px solid var(--line);padding:5px 9px;vertical-align:top}main th{background:var(--panel)}
main code{background:var(--panel);padding:1px 4px;border-radius:4px;font-size:12.5px}main pre{background:var(--panel);padding:10px;border-radius:6px;overflow:auto}main pre code{padding:0}
main blockquote{margin:8px 0;padding:4px 12px;border-left:4px solid var(--line);color:var(--mut)}
.mermaid{background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px;margin:10px 0;overflow-x:auto;text-align:center}
.err{color:#cf222e}
</style></head><body>
<header><h1 class="t">OID live volume</h1><span class="tabs"><a href="../">Dashboard</a> <a href="./" class="on">Field Guide</a></span></header>
<div class="wrap"><nav id="nav"></nav><main id="doc">Loading…</main></div>
<script src="vendor/marked.min.js"></script>
<script src="vendor/mermaid.min.js"></script>
<script>
'use strict';
mermaid.initialize({startOnLoad:false,theme:'default',securityLevel:'strict',flowchart:{htmlLabels:true}});
let PAGES=[];
const cur=()=>decodeURIComponent((location.hash||'#README.md').slice(1))||'README.md';
function navHtml(){const c=cur();document.getElementById('nav').innerHTML=PAGES.map(p=>`<a href="#${encodeURIComponent(p.file)}" class="${p.file===c?'on':''}">${p.title.replace(/[&<>]/g,'')}</a>`).join('');}
async function show(){const f=cur();navHtml();const doc=document.getElementById('doc');
 if(!/^[A-Za-z0-9._-]+\.md$/.test(f)){doc.innerHTML='<p class="err">Unknown page.</p>';return;}
 try{const r=await fetch('docs/'+f,{cache:'no-store'});if(!r.ok)throw new Error(r.status);doc.innerHTML=marked.parse(await r.text());}
 catch(e){doc.innerHTML='<p class="err">Could not load '+f+' ('+e.message+').</p>';return;}
 doc.querySelectorAll('a[href]').forEach(a=>{const h=a.getAttribute('href');if(/^[A-Za-z0-9._-]+\.md(#.*)?$/.test(h))a.setAttribute('href','#'+h.split('#')[0]);else if(/^https?:/.test(h)){a.target='_blank';a.rel='noopener noreferrer';}});
 doc.querySelectorAll('img[src]').forEach(i=>{const s=i.getAttribute('src');if(!/^(https?:|data:|\/)/.test(s))i.setAttribute('src','docs/'+s);i.loading='lazy';});
 const blocks=[...doc.querySelectorAll('pre code.language-mermaid')];
 blocks.forEach(c=>{const d=document.createElement('div');d.className='mermaid';d.textContent=c.textContent;c.parentNode.replaceWith(d);});
 if(blocks.length){try{await mermaid.run({querySelector:'#doc .mermaid'});}catch(e){console.error(e);}}
 window.scrollTo(0,0);document.title=(PAGES.find(p=>p.file===f)||{title:f}).title+' — OID Field Guide';}
fetch('docs/index.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{PAGES=d;}).catch(()=>{}).finally(show);
window.addEventListener('hashchange',show);
</script></body></html>
